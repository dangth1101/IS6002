[project]
name = "bird-demo"
version = "0.1.0"
description = "BIRD text-to-SQL demo: an LLM writes SQL, it runs on a BIRD database, and it's scored with EX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai",
    "python-dotenv",
    "streamlit>=1.65",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
